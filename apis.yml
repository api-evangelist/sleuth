aid: sleuth
url: https://raw.githubusercontent.com/api-evangelist/sleuth/refs/heads/main/apis.yml
name: Sleuth
kind: company
description: Sleuth is a deployment-based DORA metrics platform that tracks software
  delivery performance. Teams register deployments, manual changes, and custom
  impact values through Sleuth's REST registration API and GraphQL surface, then
  Sleuth computes the four DORA metrics (deploy frequency, lead time, change
  failure rate, and mean time to recovery) across projects and environments.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- DORA
- DevOps
- Deployment Tracking
- Engineering Metrics
- Continuous Delivery
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
apis:
- aid: sleuth:deployments-registration
  name: Sleuth Deployments Registration API
  tags:
  - Deployments
  - Registration
  - Code Changes
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.sleuth.io/sleuth-dora/sleuth-api/deploy-registration
  baseURL: https://app.sleuth.io/api/1
  properties:
  - url: https://help.sleuth.io/sleuth-dora/sleuth-api/deploy-registration
    type: Documentation
  - url: https://help.sleuth.io/sleuth-dora/sleuth-api
    type: APIReference
  - url: openapi/sleuth-openapi.yml
    type: OpenAPI
  - url: collections/sleuth.postman_collection.json
    type: PostmanCollection
  - url: collections/sleuth.opencollection.json
    type: OpenCollection
  description: Registers code deployments against a project's deployment and
    environment by git SHA, with optional branch, tags, links, commits, files,
    and pull request metadata, so Sleuth can compute deploy frequency and lead
    time.
- aid: sleuth:manual-change-registration
  name: Sleuth Manual Change API
  tags:
  - Manual Changes
  - Change Sources
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.sleuth.io/sleuth-dora/sleuth-api/manual-change
  baseURL: https://app.sleuth.io/api/1
  properties:
  - url: https://help.sleuth.io/sleuth-dora/sleuth-api/manual-change
    type: Documentation
  - url: openapi/sleuth-openapi.yml
    type: OpenAPI
  - url: collections/sleuth.postman_collection.json
    type: PostmanCollection
  - url: collections/sleuth.opencollection.json
    type: OpenCollection
  description: Registers non-code, free-form manual changes (such as feature
    flag flips, infrastructure changes, or config updates) against a project so
    they appear on the Sleuth deploy timeline and factor into DORA metrics.
- aid: sleuth:metric-impact
  name: Sleuth Metric and Incident Impact API
  tags:
  - Impact
  - Metrics
  - Incidents
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.sleuth.io/sleuth-dora/sleuth-api/custom-metric-impact-registration
  baseURL: https://app.sleuth.io/api/1
  properties:
  - url: https://help.sleuth.io/sleuth-dora/sleuth-api/custom-metric-impact-registration
    type: Documentation
  - url: https://help.sleuth.io/sleuth-dora/sleuth-api/custom-incident-impact-registration
    type: APIReference
  - url: openapi/sleuth-openapi.yml
    type: OpenAPI
  - url: collections/sleuth.postman_collection.json
    type: PostmanCollection
  - url: collections/sleuth.opencollection.json
    type: OpenCollection
  description: Registers custom metric impact values (floats) and custom incident
    impact events (triggered, resolved, reopened) against an impact source so
    Sleuth can run anomaly detection and grade deploy health and change failure
    rate.
- aid: sleuth:graphql
  name: Sleuth GraphQL API
  tags:
  - GraphQL
  - Projects
  - Environments
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.sleuth.io/sleuth-dora/sleuth-api
  baseURL: https://app.sleuth.io/graphql
  properties:
  - url: https://help.sleuth.io/sleuth-dora/sleuth-api
    type: Documentation
  description: Sleuth's primary public API, built on GraphQL - the same API
    Sleuth uses internally - for managing projects, environments, deployments,
    and metrics, with an interactive GraphiQL explorer at the endpoint.
- aid: sleuth:webhooks
  name: Sleuth Webhook Actions
  tags:
  - Webhooks
  - Automations
  - Events
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.sleuth.io/sleuth-dora/sleuth-automations/actions/webhook
  baseURL: https://app.sleuth.io
  properties:
  - url: https://help.sleuth.io/sleuth-dora/sleuth-automations/actions/webhook
    type: Documentation
  description: Outbound webhook automation action that sends an HTTP POST with a
    JSON deployment payload to a URL of your choosing, signed with X-SLEUTH-TIMESTAMP
    and X-SLEUTH-SIGNATURE headers (Slack-style verification using your org API key).
