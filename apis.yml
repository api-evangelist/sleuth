aid: sleuth
url: https://raw.githubusercontent.com/api-evangelist/sleuth/refs/heads/main/apis.yml
name: Sleuth
kind: company
description: Sleuth is a deployment-based DORA metrics platform that tracks software
  delivery performance. Teams register deployments, manual changes, and custom
  impact values through Sleuth's REST registration API and GraphQL surface, then
  Sleuth computes the four DORA metrics (deploy frequency, lead time, change
  failure rate, and mean time to recovery) across projects and environments.
