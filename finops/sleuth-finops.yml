meters:
- name: developer_seats
  description: Active developer seats billed per developer per month on the Team plan.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - organization
- name: deploy_registrations
  description: Deploy registration API calls; included with subscription, not separately billed.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - project
- name: impact_registrations
  description: Custom metric and incident impact registrations; included with subscription.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - impact_source
principles:
- name: Visibility
  description: Track active developer seats per organization against the per-seat Team rate.
- name: Allocation
  description: Map Sleuth projects and teams to internal cost centers for per-seat chargeback.
- name: Optimization
  description: Right-size paid seats to active contributors; keep small teams on the free tier where eligible.
- name: Accountability
  description: Review seat counts and Enterprise contract terms periodically against engineering headcount.
