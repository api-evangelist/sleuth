description: >-
  FinOps view of Sleuth spend. Sleuth's DORA metrics product bills on a
  per-developer, per-seat subscription basis rather than per-API-call usage:
  a free tier for small teams, a per-developer Team plan, and a custom
  Enterprise agreement. The registration API and GraphQL surface are included
  with a subscription, so the primary cost driver is the number of active
  developer seats, not API request volume.
notes: >-
  Per-seat rates are subject to change and Sleuth has been repositioning its
  product line; verify the active DORA plan and per-developer price on the
  Sleuth pricing page during reconciliation.
